<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Currency & Crypto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hide default number arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        /* Modal animation */
        .modal-enter { opacity: 0; transform: scale(0.95); transition: all 0.2s ease-out; }
        .modal-enter-active { opacity: 1; transform: scale(1); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8 font-sans text-gray-800">
    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[90vh] relative">
        
        <!-- Header & Input Section -->
        <div class="bg-gradient-to-br from-indigo-700 to-purple-800 p-6 text-white shrink-0 shadow-md z-10">
            <h1 class="text-xl font-bold mb-6 text-center tracking-wide">Fiat & Crypto Rates</h1>
            
            <div class="bg-white/20 p-4 rounded-2xl backdrop-blur-md border border-white/20 relative">
                <label class="block text-xs font-semibold text-indigo-100 mb-2 uppercase tracking-widest">Base Amount & Currency</label>
                <div class="flex items-center space-x-3">
                    <!-- Base Currency Selector Button (Replacing native select) -->
                    <button id="baseCurrencyBtn" class="flex items-center justify-between w-32 bg-transparent text-2xl font-bold text-white focus:outline-none cursor-pointer border-r border-indigo-300/30 pr-2 pb-1 hover:text-indigo-200 transition-colors">
                        <span id="baseCurrencyDisplay">USD</span>
                        <svg class="w-5 h-5 ml-1 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    
                    <input type="number" id="amount" value="1" min="0" class="w-full bg-transparent text-right text-4xl font-bold text-white focus:outline-none placeholder-indigo-300/50" placeholder="0">
                </div>
            </div>
            
            <div class="flex justify-between items-center mt-4 px-1">
                <div id="statusText" class="text-xs text-indigo-200 flex items-center space-x-2">
                    <span>Loading rates...</span>
                </div>
                <button id="openTargetModalBtn" class="flex items-center space-x-1 bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full text-xs font-medium transition-colors border border-white/10">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    <span>Add Asset</span>
                </button>
            </div>
        </div>

        <!-- List Section -->
        <div class="flex-1 overflow-y-auto p-4 bg-gray-50 pb-20">
            <div id="currencyList" class="space-y-3">
                <!-- Currency items injected here -->
            </div>
            
            <!-- Empty State -->
            <div id="emptyState" class="hidden flex flex-col items-center justify-center h-full text-gray-400 mt-10">
                <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p class="text-sm text-center px-6">Your list is empty.<br>Tap "Add Asset" above to select which rates you want to see.</p>
            </div>
        </div>

        <!-- Universal Search Modal -->
        <div id="universalModal" class="absolute inset-0 z-50 hidden flex-col bg-white">
            <div class="bg-indigo-700 text-white p-4 flex items-center justify-between shadow-md">
                <h2 id="modalTitle" class="font-bold text-lg">Select Asset</h2>
                <button id="closeModalBtn" class="p-2 hover:bg-indigo-800 rounded-full transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-4 border-b border-gray-100">
                <div class="relative">
                    <svg class="w-5 h-5 absolute left-3 top-2.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="searchInput" class="w-full bg-gray-100 pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Search asset (e.g. BTC, ETH, IDR)...">
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-2" id="modalCurrencyList">
                <!-- Modal items injected here -->
            </div>
        </div>
    </div>

    <script>
        const amountInput = document.getElementById('amount');
        const baseCurrencyBtn = document.getElementById('baseCurrencyBtn');
        const baseCurrencyDisplay = document.getElementById('baseCurrencyDisplay');
        const currencyList = document.getElementById('currencyList');
        const statusText = document.getElementById('statusText');
        const emptyState = document.getElementById('emptyState');
        
        // Modal elements
        const universalModal = document.getElementById('universalModal');
        const modalTitle = document.getElementById('modalTitle');
        const openTargetModalBtn = document.getElementById('openTargetModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const searchInput = document.getElementById('searchInput');
        const modalCurrencyList = document.getElementById('modalCurrencyList');

        let ratesData = {};
        let allCurrencies = [];
        
        // Modal state: 'base' or 'target'
        let currentModalMode = 'target'; 
        
        const priorityList = ['USD', 'IDR', 'EUR', 'GBP', 'JPY', 'BTC', 'ETH', 'SOL', 'DOGE', 'USDT'];
        let currentBase = localStorage.getItem('baseCurrency') || 'USD';
        let myCurrencies = JSON.parse(localStorage.getItem('myCurrencies')) || ['IDR', 'EUR', 'GBP', 'JPY', 'BTC', 'ETH', 'SOL'];

        function savePreferences() {
            localStorage.setItem('myCurrencies', JSON.stringify(myCurrencies));
            localStorage.setItem('baseCurrency', currentBase);
        }

        async function fetchRates(base) {
            statusText.innerHTML = `
                <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span>Fetching live rates...</span>`;
                
            try {
                const response = await fetch(`https://api.coinbase.com/v2/exchange-rates?currency=${base}`);
                if (!response.ok) throw new Error('Network error');
                const json = await response.json();
                
                if (json.data && json.data.rates) {
                    const rawRates = json.data.rates;
                    ratesData = {};
                    for (const [key, val] of Object.entries(rawRates)) {
                        ratesData[key] = parseFloat(val);
                    }
                    
                    allCurrencies = Object.keys(ratesData);
                    baseCurrencyDisplay.textContent = currentBase; // Update UI Display
                    
                    statusText.innerHTML = `
                        <svg class="w-4 h-4 text-green-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        <span>Updated live via Coinbase</span>`;
                    
                    renderList();
                }
            } catch (error) {
                console.error("Error fetching rates:", error);
                statusText.innerHTML = `<span class="text-red-200">Error loading rates.</span>`;
            }
        }

        function removeCurrency(currencyCode) {
            myCurrencies = myCurrencies.filter(c => c !== currencyCode);
            savePreferences();
            renderList();
        }

        function addCurrency(currencyCode) {
            if (!myCurrencies.includes(currencyCode) && currencyCode !== currentBase) {
                myCurrencies.push(currencyCode);
                savePreferences();
                renderList();
            }
        }

        function toggleTargetCurrency(currencyCode) {
            if (myCurrencies.includes(currencyCode)) {
                removeCurrency(currencyCode);
            } else {
                addCurrency(currencyCode);
            }
            renderModalList(searchInput.value); // Re-render to show checkmark update immediately
        }

        function selectBaseCurrency(currencyCode) {
            if (currencyCode !== currentBase) {
                currentBase = currencyCode;
                savePreferences();
                
                // If new base was in the targets, remove it
                if (myCurrencies.includes(currentBase)) {
                    removeCurrency(currentBase);
                }
                
                baseCurrencyDisplay.textContent = currentBase;
                fetchRates(currentBase);
            }
            closeModal();
        }

        function formatNumber(num) {
            if (num === 0) return "0";
            if (num < 0.000001) return num.toFixed(8);
            if (num < 0.01) return num.toFixed(6);
            if (num < 100) return new Intl.NumberFormat('en-US', { maximumFractionDigits: 4 }).format(num);
            return new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }).format(num);
        }

        function renderList() {
            const amount = parseFloat(amountInput.value) || 0;
            
            let html = '';
            const displayList = myCurrencies.filter(c => c !== currentBase && ratesData[c]);

            if (displayList.length === 0) {
                currencyList.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            displayList.forEach(currency => {
                const rate = ratesData[currency];
                const convertedValue = amount * rate;
                
                const formattedValue = formatNumber(convertedValue);
                const formattedRate = formatNumber(rate);
                
                const isCrypto = ['BTC','ETH','SOL','USDT','DOGE','ADA','XRP'].includes(currency) || rate < 0.01 && !['IDR','VND'].includes(currency);

                html += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center group relative hover:shadow-md transition-all duration-200">
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 ${isCrypto ? 'bg-gradient-to-br from-purple-50 to-indigo-100 text-indigo-700' : 'bg-gradient-to-br from-blue-50 to-cyan-100 text-blue-700'} rounded-full flex items-center justify-center font-bold text-sm shadow-inner shrink-0 overflow-hidden">
                                ${currency.length > 4 ? currency.substring(0,3)+'..' : currency}
                            </div>
                            <div class="overflow-hidden">
                                <h3 class="font-bold text-gray-800 text-lg">${currency}</h3>
                                <p class="text-xs text-gray-400 font-medium tracking-wide truncate">1 ${currentBase} = ${formattedRate}</p>
                            </div>
                        </div>
                        
                        <div class="text-right pl-2 overflow-hidden flex-1">
                            <span class="text-xl font-extrabold text-gray-800 truncate block">${formattedValue}</span>
                        </div>
                        
                        <button onclick="removeCurrency('${currency}')" class="absolute -top-2 -right-2 bg-red-100 text-red-600 rounded-full p-1.5 shadow-sm opacity-0 group-hover:opacity-100 transition-opacity focus:opacity-100 hover:bg-red-200">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                `;
            });
            
            currencyList.innerHTML = html;
        }

        // --- Shared Modal Rendering ---
        function renderModalList(searchTerm = '') {
            let html = '';
            const search = searchTerm.toUpperCase();
            
            let renderQueue = allCurrencies;
            if (!search) {
                renderQueue = [...priorityList.filter(c => allCurrencies.includes(c)), ...allCurrencies.filter(c => !priorityList.includes(c))];
            }

            renderQueue.forEach(currency => {
                if (search && !currency.includes(search)) return;
                
                if (currentModalMode === 'target') {
                    // TARGET MODE (Multiple Selection)
                    if (currency === currentBase) return; // Hide base from target list
                    const isSelected = myCurrencies.includes(currency);
                    
                    html += `
                        <div onclick="toggleTargetCurrency('${currency}')" class="flex items-center justify-between p-3 border-b border-gray-50 hover:bg-gray-50 cursor-pointer rounded-lg transition-colors">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 ${isSelected ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600'} rounded-full flex items-center justify-center font-bold text-xs transition-colors overflow-hidden">
                                    ${currency.length > 4 ? currency.substring(0,3)+'..' : currency}
                                </div>
                                <span class="font-medium text-gray-800">${currency}</span>
                            </div>
                            <div>
                                ${isSelected ? 
                                    `<svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>` : 
                                    `<svg class="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>`
                                }
                            </div>
                        </div>
                    `;
                } else {
                    // BASE MODE (Single Selection)
                    const isSelected = (currency === currentBase);
                    
                    html += `
                        <div onclick="selectBaseCurrency('${currency}')" class="flex items-center justify-between p-3 border-b border-gray-50 hover:bg-gray-50 cursor-pointer rounded-lg transition-colors">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 ${isSelected ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600'} rounded-full flex items-center justify-center font-bold text-xs transition-colors overflow-hidden">
                                    ${currency.length > 4 ? currency.substring(0,3)+'..' : currency}
                                </div>
                                <span class="font-medium ${isSelected ? 'text-purple-700 font-bold' : 'text-gray-800'}">${currency}</span>
                            </div>
                            <div>
                                ${isSelected ? 
                                    `<svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>` : 
                                    ``
                                }
                            </div>
                        </div>
                    `;
                }
            });
            
            modalCurrencyList.innerHTML = html;
        }

        function openModal(mode) {
            currentModalMode = mode;
            searchInput.value = '';
            
            if (mode === 'base') {
                modalTitle.textContent = 'Select Base Currency';
            } else {
                modalTitle.textContent = 'Add Fiat or Crypto';
            }
            
            renderModalList();
            universalModal.classList.remove('hidden');
            universalModal.classList.add('flex');
            
            // Auto focus search input on desktop
            setTimeout(() => searchInput.focus(), 100);
        }

        function closeModal() {
            universalModal.classList.add('hidden');
            universalModal.classList.remove('flex');
        }

        // Event Listeners for Modals
        baseCurrencyBtn.addEventListener('click', () => openModal('base'));
        openTargetModalBtn.addEventListener('click', () => openModal('target'));
        closeModalBtn.addEventListener('click', closeModal);
        
        searchInput.addEventListener('input', (e) => {
            renderModalList(e.target.value);
        });

        // Real-time calculation on input
        let debounceTimer;
        amountInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(renderList, 50);
        });

        // Expose to window for inline HTML onclick handlers
        window.removeCurrency = removeCurrency;
        window.toggleTargetCurrency = toggleTargetCurrency;
        window.selectBaseCurrency = selectBaseCurrency;

        // Initialize
        fetchRates(currentBase);
    </script>
</body>
</html>
